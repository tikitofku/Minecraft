<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft | Mainpage</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="shortcut icon" href="./favicon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
            <div class="header__content">
                <div class="header__top">
                    <div class="container">
                        <a href="" class="link-auto">Войти в акк</a>
                        <a href="" class="link-auto">Активировать код</a>
                    </div>
                </div>
                <div class="header__bottom">
                    <div class="container">
                        <a href="" class="logo-link">
                            <div class="logo-link__wrapper-img">
                                <img src="./img/minecraft-logo.png" alt="logo" class="logo-link__img">
                            </div>
                        </a> 
                        <nav class="menu">
                            <ul class="menu__list">
                                <li class="menu__item">
                                    <a href="" class="link-other-page">
                                        <div class="link-other-page__wraper-img">
                                            <img src="./img/cube.png" alt="cube" class="link-other-page__img">
                                        </div>
                                        <span class="link-other-page__text">Об игре</span>
                                    </a>
                                </li>
                                <li class="menu__item">
                                    <a href="" class="link-other-page">
                                        <div class="link-other-page__wraper-img">
                                            <img src="./img/chest.png" alt="chest" class="link-other-page__img">
                                        </div>
                                        <span class="link-other-page__text">Игровые ресурсы</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
    </header>
    <main class="main">
        <div class="container">
            <section class="hero">
                <div class="hero__wrapper">
                    <h1 class="main-title">Minecraft</h1>
                    <p class="hero__discription">
                        Minecraft — компьютерная инди-игра в жанре песочницы, созданная шведским программистом Маркусом Перссоном и выпущенная его студией Mojang AB. 
                    </p>
                </div>
            </section>
        </div>
    </main>
    <footer class="footer">
        <hr class="hr-shelf">
        <div class="container">
            <div class="footer__content">
                <a href="" class="logo-link">
                    <div class="logo-link__wrapper-img">
                        <img src="./img/minecraft-logo.png" alt="logo" class="logo-link__img">
                    </div>
                </a> 
                <ol class="social-list">
                    <li class="social-list__item">
                        <a href="" class="social-link">
                            <svg class="social-icon">
                                <use href="./img/sprite.svg#tg-icon"></use>
                            </svg>
                        </a>
                    </li>
                    <li class="social-list__item">
                        <a href="" class="social-link">
                            <svg class="social-icon">
                                <use href="./img/sprite.svg#fc-icon"></use>
                            </svg>
                        </a>
                    </li>
                    <li class="social-list__item">
                        <a href="" class="social-link">
                            <svg class="social-icon">
                                <use href="./img/sprite.svg#vk-icon"></use>
                            </svg>
                        </a>
                    </li> 
                </ol>
            </div>
        </div>
    </footer>
</body>
</html>
